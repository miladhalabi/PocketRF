name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (XIAO ESP32C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The platformio.ini pins an unreleased pioarduino platform tarball, so
      # this cache is what keeps CI from re-downloading ~300 MB per run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Compile
        run: pio run -e seeed_xiao_esp32c3

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/firmware
          B=.pio/build/seeed_xiao_esp32c3
          cp "$B/firmware.bin" dist/firmware/
          cp "$B/bootloader.bin" dist/firmware/
          cp "$B/partitions.bin" dist/firmware/

      # Convenience single-image file for first-time flashing. Non-fatal: if the
      # merged image fails, the three separate binaries above are still usable.
      - name: Merge into one flashable image
        continue-on-error: true
        run: |
          set -x
          B=.pio/build/seeed_xiao_esp32c3
          ~/.platformio/penv/bin/python -m esptool --chip esp32c3 merge_bin \
            -o dist/firmware/pocketrf-xiao-esp32c3-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0x10000 "$B/firmware.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # NOTE: the release build type is currently signed with the local debug key
      # (see android_app/app/build.gradle.kts). The APK installs, but it cannot be
      # distributed via a store and cannot upgrade over a differently-signed build.
      - name: Assemble release APK
        working-directory: android_app
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android_app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Tidy artifact names
        run: |
          set -euo pipefail
          mkdir -p out
          cp artifacts/firmware/pocketrf-xiao-esp32c3-full.bin out/ 2>/dev/null || true
          cp artifacts/firmware/firmware.bin out/pocketrf-firmware-${{ github.ref_name }}.bin
          cp artifacts/firmware/bootloader.bin out/pocketrf-bootloader-${{ github.ref_name }}.bin
          cp artifacts/firmware/partitions.bin out/pocketrf-partitions-${{ github.ref_name }}.bin
          cp artifacts/android/*.apk out/pocketrf-android-${{ github.ref_name }}.apk
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            **Development preview.** Not a stable release.

            - **Web flasher:** https://miladhalabi.github.io/PocketRF/ — install from Chrome/Edge/Opera on desktop.
            - Firmware: `pocketrf-xiao-esp32c3-full.bin` (single image, flash at `0x0`) or the
              three separate binaries if you prefer.
            - Android: `pocketrf-android-${{ github.ref_name }}.apk` — signed with a debug key,
              so it installs but cannot be published to a store.

            Read [`LEGAL.md`](https://github.com/${{ github.repository }}/blob/main/LEGAL.md)
            before transmitting. Jamming is illegal in most jurisdictions.
          files: out/*

  # Publishes the web flasher plus the freshly built firmware binaries to GitHub Pages.
  # ESP Web Tools resolves the manifest's part paths relative to the page, so the bins
  # must sit next to manifest.json — hence the copy below.
  pages:
    name: Web flasher (GitHub Pages)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp flash/index.html flash/manifest.json site/
          cp artifacts/firmware/bootloader.bin \
             artifacts/firmware/partitions.bin \
             artifacts/firmware/firmware.bin \
             site/
          ls -lh site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
