; PlatformIO Project Configuration File for Headless CC1101 BLE Transceiver
; Target Microcontroller: Seeed Studio XIAO ESP32C3

[env:seeed_xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter, colorize

build_flags =
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

lib_deps =
	h2zero/NimBLE-Arduino@^2.5.0
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	bblanchon/ArduinoJson@^7.0.0
